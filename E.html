<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rooms: Reborn</title>
  
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: #fff;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      background: rgba(10, 12, 16, 0.92);
      backdrop-filter: blur(12px);
    }

    .hidden {
      display: none !important;
    }

    .menu-title {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: #f39c12;
      text-shadow: 0 0 30px rgba(243, 156, 18, 0.6), 2px 2px 5px #000;
      margin-bottom: 2rem;
      text-transform: uppercase;
      text-align: center;
    }

    .menu-btn {
      width: 250px;
      padding: 15px 30px;
      margin: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #2c3e50, #34495e);
      border: 2px solid #f39c12;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .menu-btn:hover, .menu-btn:active {
      background: linear-gradient(135deg, #f39c12, #e67e22);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(243, 156, 18, 0.5);
    }

    .avatar-card {
      background: rgba(20, 25, 35, 0.95);
      border: 2px solid #f39c12;
      border-radius: 12px;
      padding: 26px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.9);
    }

    .avatar-card h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #f39c12;
      letter-spacing: 1px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .color-item {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ccc;
    }

    .color-item label {
      margin-bottom: 4px;
    }

    .color-item input[type="color"] {
      width: 100%;
      height: 40px;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px rgba(0,0,0,0.9);
    }

    #interactionPrompt {
      position: absolute;
      bottom: 35px;
      right: 35px;
      width: 72px;
      height: 72px;
      background: #f39c12;
      border: 3px solid #ffffff;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      z-index: 15;
    }

    #interactionPrompt svg {
      width: 38px;
      height: 38px;
    }

    #batteryWidget {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 15, 20, 0.85);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .battery-shell {
      width: 50px;
      height: 24px;
      border: 2px solid #fff;
      border-radius: 4px;
      padding: 2px;
      position: relative;
      display: flex;
      gap: 2px;
    }

    .battery-shell::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 6px;
      width: 3px;
      height: 8px;
      background-color: #fff;
      border-radius: 0 2px 2px 0;
    }

    .battery-bar {
      flex: 1;
      height: 100%;
      background-color: #2ecc71;
      border-radius: 1px;
      transition: background-color 0.2s;
    }

    .battery-bar.empty {
      background-color: transparent !important;
    }

    .battery-count {
      font-weight: 800;
      font-size: 1.1rem;
      color: #f39c12;
    }

    #hotbar {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .hotbar-slot {
      width: 76px;
      height: 76px;
      background: rgba(25, 28, 35, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
    }

    .hotbar-slot.active {
      border-color: #f39c12;
      background: rgba(243, 156, 18, 0.35);
      box-shadow: 0 0 15px rgba(243, 156, 18, 0.6);
    }

    .hotbar-slot svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      margin-bottom: 4px;
    }

    #mobileControls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
    }

    #joystickContainer {
      position: absolute;
      bottom: 35px;
      left: 35px;
      width: 125px;
      height: 125px;
      background: rgba(30, 30, 35, 0.55);
      border: 3px solid rgba(80, 80, 90, 0.6);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }

    #joystickKnob {
      position: absolute;
      top: 37px;
      left: 37px;
      width: 50px;
      height: 50px;
      background: #e08b18;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    #touchCameraZone {
      position: absolute;
      top: 0;
      right: 0;
      width: 65%;
      height: 100%;
      pointer-events: auto;
      touch-action: none;
    }

    #jumpBtn {
      position: absolute;
      bottom: 120px;
      right: 35px;
      width: 72px;
      height: 72px;
      background: #f39c12;
      border: 3px solid #fff;
      border-radius: 50%;
      pointer-events: auto;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      cursor: pointer;
      z-index: 15;
    }

    #jumpBtn svg {
      width: 38px;
      height: 38px;
    }
  </style>
</head>
<body>

  <canvas id="renderCanvas"></canvas>

  <div id="mainMenu" class="overlay">
    <h1 class="menu-title">Rooms: Reborn</h1>
    <button id="playBtn" class="menu-btn">PLAY</button>
    <button id="avatarBtn" class="menu-btn">AVATAR</button>
  </div>

  <div id="avatarMenu" class="overlay hidden">
    <div class="avatar-card">
      <h2>Customise Player (R6)</h2>
      <div class="color-grid">
        <div class="color-item">
          <label>Head</label>
          <input type="color" id="colHead" value="#f3c794">
        </div>
        <div class="color-item">
          <label>Torso</label>
          <input type="color" id="colTorso" value="#00a2ff">
        </div>
        <div class="color-item">
          <label>Left Arm</label>
          <input type="color" id="colLArm" value="#f3c794">
        </div>
        <div class="color-item">
          <label>Right Arm</label>
          <input type="color" id="colRArm" value="#f3c794">
        </div>
        <div class="color-item">
          <label>Left Leg</label>
          <input type="color" id="colLLeg" value="#1b2a4a">
        </div>
        <div class="color-item">
          <label>Right Leg</label>
          <input type="color" id="colRLeg" value="#1b2a4a">
        </div>
      </div>
      <button id="saveAvatarBtn" class="menu-btn" style="width:100%; margin:0;">SAVE & BACK</button>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="interactionPrompt"></div>

    <div id="batteryWidget" class="hidden">
      <div class="battery-shell">
        <div id="bBar1" class="battery-bar"></div>
        <div id="bBar2" class="battery-bar"></div>
        <div id="bBar3" class="battery-bar"></div>
      </div>
      <div id="batteryCount" class="battery-count">x0</div>
    </div>

    <div id="hotbar">
      <div id="slotFlashlight" class="hotbar-slot">
        <svg viewBox="0 0 24 24">
          <path d="M18 6L6 6M16 6L14 10L14 20L10 20L10 10L8 6"></path>
        </svg>
        <span>Flashlight</span>
      </div>
    </div>
  </div>

  <div id="mobileControls">
    <div id="joystickContainer">
      <div id="joystickKnob"></div>
    </div>
    <div id="touchCameraZone"></div>
  </div>

  <div id="jumpBtn">
    <svg viewBox="0 0 24 24">
      <path d="M12 4L4 14H9V20H15V14H20L12 4Z" fill="black"/>
    </svg>
  </div>

  <script>
    // --- PROCEDURAL TEXTURES ---
    // Textures are drawn at high resolution with layered noise/gradients/grain,
    // and a matching normal map is derived from each one so the room's point
    // lights and flashlight actually rake across the surface detail instead
    // of everything looking flat.
    function makeTextureCanvas(w, h, drawFn) {
      const cvs = document.createElement('canvas');
      cvs.width = w;
      cvs.height = h;
      const ctx = cvs.getContext('2d');
      drawFn(ctx, w, h);
      return cvs;
    }

    function dataUrl(cvs) {
      return cvs.toDataURL();
    }

    // Derives a tangent-space normal map from a canvas's luminance so flat
    // procedural art gets real per-pixel shading under directional lights.
    function normalMapFromCanvas(srcCanvas, strength) {
      const w = srcCanvas.width, h = srcCanvas.height;
      const src = srcCanvas.getContext('2d').getImageData(0, 0, w, h).data;

      const lum = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) {
        const o = i * 4;
        lum[i] = (src[o] * 0.299 + src[o + 1] * 0.587 + src[o + 2] * 0.114) / 255;
      }

      const out = document.createElement('canvas');
      out.width = w;
      out.height = h;
      const octx = out.getContext('2d');
      const img = octx.createImageData(w, h);

      for (let y = 0; y < h; y++) {
        const yU = (y - 1 + h) % h, yD = (y + 1) % h;
        for (let x = 0; x < w; x++) {
          const xL = (x - 1 + w) % w, xR = (x + 1) % w;
          const dx = (lum[y * w + xL] - lum[y * w + xR]) * strength;
          const dy = (lum[yU * w + x] - lum[yD * w + x]) * strength;
          let nx = -dx, ny = -dy, nz = 1.0;
          const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
          nx /= len; ny /= len; nz /= len;
          const o = (y * w + x) * 4;
          img.data[o] = (nx * 0.5 + 0.5) * 255;
          img.data[o + 1] = (ny * 0.5 + 0.5) * 255;
          img.data[o + 2] = (nz * 0.5 + 0.5) * 255;
          img.data[o + 3] = 255;
        }
      }
      octx.putImageData(img, 0, 0);
      return out.toDataURL();
    }

    function speckle(ctx, w, h, count, minSize, maxSize, color) {
      ctx.fillStyle = color;
      for (let i = 0; i < count; i++) {
        const s = minSize + Math.random() * (maxSize - minSize);
        ctx.fillRect(Math.random() * w, Math.random() * h, s, s);
      }
    }

    // Clean dark-red low-pile carpet: dense fibers, subtle directional nap, no grid and no bulky cushion-like patches.
    const texRedCarpet = makeTextureCanvas(1024, 1024, (ctx, w, h) => {
      const base = ctx.createLinearGradient(0, 0, 0, h);
      base.addColorStop(0, '#3f0b14');
      base.addColorStop(0.45, '#5b101d');
      base.addColorStop(1, '#390914');
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, w, h);

      // Very fine, even pile. The texture remains visually continuous instead of forming blobs.
      for (let i = 0; i < 120000; i++) {
        const x = Math.random() * w, y = Math.random() * h;
        const len = 0.8 + Math.random() * 2.2;
        const a = 0.022 + Math.random() * 0.045;
        ctx.strokeStyle = Math.random() > 0.52
          ? `rgba(225,150,160,${a})`
          : `rgba(8,1,4,${a})`;
        ctx.lineWidth = 0.35 + Math.random() * 0.55;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + len, y + (Math.random()-0.5)*0.65);
        ctx.stroke();
      }

      // Tiny tone variation only; no large stains or shapes.
      for (let i = 0; i < 18000; i++) {
        const x = Math.random() * w, y = Math.random() * h;
        const a = 0.015 + Math.random() * 0.025;
        ctx.fillStyle = Math.random() > 0.5 ? `rgba(235,180,185,${a})` : `rgba(0,0,0,${a})`;
        ctx.fillRect(x, y, 1, 1);
      }

      const softEdge = ctx.createRadialGradient(w/2, h/2, w*0.15, w/2, h/2, w*0.78);
      softEdge.addColorStop(0, 'rgba(0,0,0,0)');
      softEdge.addColorStop(1, 'rgba(12,0,4,0.14)');
      ctx.fillStyle = softEdge;
      ctx.fillRect(0,0,w,h);
    });

    // Medium stone-grey wall panels with a restrained mahogany wood design.
    // The grey reads as the room's main surface while the dark reddish-brown grain gives it the requested mahogany character.
    function drawMahoganyPlankWall(ctx, w, h, plankSize, vertical) {
      const base = ctx.createLinearGradient(0, 0, vertical ? w : 0, vertical ? 0 : h);
      base.addColorStop(0, '#5d6267');
      base.addColorStop(0.5, '#73787d');
      base.addColorStop(1, '#565b60');
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, w, h);

      const across = vertical ? w : h;
      const along = vertical ? h : w;

      for (let p = 0; p < across; p += plankSize) {
        const tone = (Math.random() - 0.5) * 12;
        ctx.fillStyle = tone < 0
          ? `rgba(15,18,20,${Math.abs(tone)/180})`
          : `rgba(220,225,228,${tone/520})`;
        if (vertical) ctx.fillRect(p, 0, plankSize, h);
        else ctx.fillRect(0, p, w, plankSize);

        // Mahogany-colored linear grain embedded into the stone-grey panel.
        for (let i = 0; i < 20; i++) {
          const gPos = Math.random() * along;
          const amp = 2 + Math.random() * 4;
          ctx.strokeStyle = Math.random() > 0.30
            ? `rgba(76,28,24,${0.08 + Math.random()*0.055})`
            : `rgba(150,68,50,${0.035 + Math.random()*0.035})`;
          ctx.lineWidth = 0.65 + Math.random() * 1.15;
          ctx.beginPath();
          for (let ss = 0; ss <= plankSize; ss += 10) {
            const wob = Math.sin(ss*0.025 + gPos*0.08) * amp + Math.sin(ss*0.008 + gPos*0.03) * amp*0.55;
            if (vertical) {
              if (ss === 0) ctx.moveTo(p+ss, gPos+wob); else ctx.lineTo(p+ss, gPos+wob);
            } else {
              if (ss === 0) ctx.moveTo(gPos+wob, p+ss); else ctx.lineTo(gPos+wob, p+ss);
            }
          }
          ctx.stroke();
        }

        if (Math.random() < 0.22) {
          const kAlong = Math.random()*along;
          const kAcross = p + plankSize/2 + (Math.random()-0.5)*plankSize*0.35;
          const kx = vertical ? kAcross : kAlong;
          const ky = vertical ? kAlong : kAcross;
          const kg = ctx.createRadialGradient(kx,ky,0,kx,ky,14);
          kg.addColorStop(0,'rgba(67,23,18,0.18)');
          kg.addColorStop(0.4,'rgba(121,54,39,0.07)');
          kg.addColorStop(1,'rgba(0,0,0,0)');
          ctx.fillStyle = kg;
          ctx.beginPath(); ctx.ellipse(kx,ky,vertical?11:15,vertical?15:11,0,0,Math.PI*2); ctx.fill();
        }

        // Subtle panel seams — clean, not abandoned.
        ctx.fillStyle = 'rgba(22,25,28,0.20)';
        if (vertical) ctx.fillRect(p,0,2,h); else ctx.fillRect(0,p,w,2);
        ctx.fillStyle = 'rgba(235,238,240,0.08)';
        if (vertical) ctx.fillRect(p+2,0,1,h); else ctx.fillRect(0,p+2,w,1);
      }
    }

    const texWoodWall = makeTextureCanvas(1024, 1024, (ctx, w, h) => {
      drawMahoganyPlankWall(ctx, w, h, 128, true);
    });

    const texGreyWood = makeTextureCanvas(1024, 1024, (ctx, w, h) => {
      drawMahoganyPlankWall(ctx, w, h, 110, false);
    });

    // Dark stained door: strong vertical grain plus a recessed panel bevel.
    const texDoorWood = makeTextureCanvas(1024, 1024, (ctx, w, h) => {
      const grad = ctx.createLinearGradient(0, 0, w, 0);
      grad.addColorStop(0, '#331a0c');
      grad.addColorStop(0.5, '#432610');
      grad.addColorStop(1, '#2c1509');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 90; i++) {
        const gx = Math.random() * w;
        ctx.strokeStyle = `rgba(0,0,0,${0.05 + Math.random() * 0.12})`;
        ctx.lineWidth = 1 + Math.random() * 2;
        ctx.beginPath();
        for (let y = 0; y <= h; y += 20) {
          const wob = Math.sin(y * 0.04 + gx) * 5;
          if (y === 0) ctx.moveTo(gx + wob, y); else ctx.lineTo(gx + wob, y);
        }
        ctx.stroke();
      }
      speckle(ctx, w, h, 6000, 1, 2.2, 'rgba(0,0,0,0.12)');

      const pad = w * 0.09;
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 10;
      ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);
      ctx.strokeStyle = 'rgba(255,220,180,0.08)';
      ctx.lineWidth = 3;
      ctx.strokeRect(pad + 10, pad + 10, w - (pad + 10) * 2, h - (pad + 10) * 2);

      const sheen = ctx.createLinearGradient(0, 0, w, h);
      sheen.addColorStop(0, 'rgba(255,255,255,0.06)');
      sheen.addColorStop(0.4, 'rgba(255,255,255,0)');
      sheen.addColorStop(1, 'rgba(0,0,0,0.12)');
      ctx.fillStyle = sheen;
      ctx.fillRect(0, 0, w, h);
    });

    const texFrameWood = makeTextureCanvas(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#23120a';
      ctx.fillRect(0, 0, w, h);
      for (let x = 0; x < w; x += 30) {
        ctx.strokeStyle = `rgba(0,0,0,${0.15 + Math.random() * 0.15})`;
        ctx.lineWidth = 2 + Math.random() * 2;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(0, 0, w * 0.06, h);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(w - w * 0.06, 0, w * 0.06, h);
    });

    // Varnished tabletop: warm wavy grain with a soft diagonal gloss streak.
    const texTableWood = makeTextureCanvas(1024, 1024, (ctx, w, h) => {
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#6b3c1c');
      grad.addColorStop(1, '#4a2810');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 46; i++) {
        const gy = Math.random() * h;
        ctx.strokeStyle = `rgba(30,15,5,${0.06 + Math.random() * 0.1})`;
        ctx.lineWidth = 1 + Math.random() * 2.5;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 18) {
          const wob = Math.sin(x * 0.02 + gy) * 10 + Math.sin(x * 0.09 + gy * 2) * 3;
          if (x === 0) ctx.moveTo(x, gy + wob); else ctx.lineTo(x, gy + wob);
        }
        ctx.stroke();
      }
      speckle(ctx, w, h, 9000, 4, 14, 'rgba(0,0,0,0.05)');

      const gloss = ctx.createLinearGradient(0, 0, w, h);
      gloss.addColorStop(0, 'rgba(255,255,255,0.12)');
      gloss.addColorStop(0.35, 'rgba(255,255,255,0.02)');
      gloss.addColorStop(0.5, 'rgba(255,255,255,0.1)');
      gloss.addColorStop(1, 'rgba(0,0,0,0.1)');
      ctx.fillStyle = gloss;
      ctx.fillRect(0, 0, w, h);
    });

    // Woven fabric: crosshatched weave, cushion tone variation, faint seams.
    const texSofaFabric = makeTextureCanvas(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#181d28';
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 6; i++) {
        const px = Math.random() * w, py = Math.random() * h, pr = 60 + Math.random() * 100;
        const grad = ctx.createRadialGradient(px, py, 0, px, py, pr);
        grad.addColorStop(0, 'rgba(255,255,255,0.04)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        ctx.fill();
      }

    function ensureAudioContext() {
      if (!audioContext) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioContext = new AC();
      }
      if (audioContext.state === 'suspended') audioContext.resume();
      audioUnlocked = true;
      return audioContext;
    }

    function setupRadioAudio(worldPosition) {
      const ctx = ensureAudioContext();
      if (!ctx || radioSource) return;
      radioNodePosition.copyFrom(worldPosition);

      radioAudio = new Audio("Radio_Static.mp3");
      radioAudio.loop = true;
      radioAudio.preload = "auto";
      radioAudio.volume = 1;

      radioSource = ctx.createMediaElementSource(radioAudio);
      radioPanner = ctx.createPanner();
      radioDryGain = ctx.createGain();
      radioEchoGain = ctx.createGain();
      radioDelay = ctx.createDelay(1.0);
      radioFeedback = ctx.createGain();
      radioEchoFilter = ctx.createBiquadFilter();
      radioMasterGain = ctx.createGain();

      radioPanner.panningModel = "HRTF";
      radioPanner.distanceModel = "inverse";
      radioPanner.refDistance = 1.3;
      radioPanner.maxDistance = 10.5;
      radioPanner.rolloffFactor = 0.9;

      radioDryGain.gain.value = 0.66;
      radioEchoGain.gain.value = 0.34;
      radioDelay.delayTime.value = 0.24;
      radioFeedback.gain.value = 0.22;
      radioEchoFilter.type = "lowpass";
      radioEchoFilter.frequency.value = 3200;
      radioMasterGain.gain.value = 0;

      radioSource.connect(radioPanner);
      radioPanner.connect(radioDryGain);
      radioDryGain.connect(radioMasterGain);

      radioPanner.connect(radioDelay);
      radioDelay.connect(radioEchoFilter);
      radioEchoFilter.connect(radioEchoGain);
      radioEchoGain.connect(radioMasterGain);
      radioDelay.connect(radioFeedback);
      radioFeedback.connect(radioDelay);

      radioMasterGain.connect(ctx.destination);
      radioAudio.play().catch(() => {});
    }

    function updateRadioAudio() {
      if (!audioContext || !radioPanner || !radioMasterGain || !camera || !audioUnlocked) return;
      const listener = audioContext.listener;
      const p = radioNodePosition;
      const c = camera.position;

      if (listener.positionX) {
        listener.positionX.value = c.x;
        listener.positionY.value = c.y;
        listener.positionZ.value = c.z;
        radioPanner.positionX.value = p.x;
        radioPanner.positionY.value = p.y;
        radioPanner.positionZ.value = p.z;
      } else {
        listener.setPosition(c.x,c.y,c.z);
        radioPanner.setPosition(p.x,p.y,p.z);
      }

      // Radio exists acoustically only in the spawn room. It fades out approaching the exit.
      const spawnHalfLength = 8.0;
      const absZ = Math.abs(c.z);
      const distance = BABYLON.Vector3.Distance(c, p);
      const roomFactor = absZ <= spawnHalfLength ? 1.0 : 0.0;
      const edgeFade = roomFactor ? Math.min(1.0, Math.max(0.0, (spawnHalfLength - absZ) / 1.7)) : 0.0;
      const distanceFactor = Math.min(1.0, Math.max(0.0, 1 - Math.max(0, distance - 1.0) / 8.2));
      const target = roomFactor * edgeFade * distanceFactor;
      radioMasterGain.gain.setTargetAtTime(target * 0.92, audioContext.currentTime, 0.075);
    }

    function playDoorSoundSequence(openCallback) {
      const ctx = ensureAudioContext();
      const audio = new Audio("Door_Open.mp3");
      audio.preload = "auto";
      audio.playbackRate = 0.72;

      let source = null, delay = null, echoGain = null, dryGain = null, master = null, feedback = null, echoFilter = null;

      const wire = () => {
        if (!ctx || source) return;
        source = ctx.createMediaElementSource(audio);
        dryGain = ctx.createGain();
        echoGain = ctx.createGain();
        delay = ctx.createDelay(1.0);
        master = ctx.createGain();
        feedback = ctx.createGain();
        echoFilter = ctx.createBiquadFilter();

        dryGain.gain.value = 0.54;
        echoGain.gain.value = 0.24;
        master.gain.value = 0.78;
        delay.delayTime.value = 0.22;
        feedback.gain.value = 0.20;
        echoFilter.type = "lowpass";
        echoFilter.frequency.value = 2800;

        source.connect(dryGain);
        dryGain.connect(master);
        source.connect(delay);
        delay.connect(echoFilter);
        echoFilter.connect(echoGain);
        echoGain.connect(master);
        delay.connect(feedback);
        feedback.connect(delay);
        master.connect(ctx.destination);
      };

      audio.addEventListener("canplay", () => {
        wire();
        audio.play().catch(() => {});
        setTimeout(() => {
          audio.pause();
          // Mechanical pause before the second part of the sound.
          setTimeout(() => {
            const begin = () => {
              const remainingSourceSeconds = Math.max(0.5, (audio.duration || 3.216) - audio.currentTime);
              const realDuration = (remainingSourceSeconds / audio.playbackRate) * 1000;
              openCallback(realDuration);
            };
            audio.addEventListener("play", begin, {once:true});
            audio.play().catch(() => {});
          }, 420);
        }, 1000);
      }, {once:true});
      audio.load();
    }

    // PLAYER AVATAR (Seamless Torso/Arms Connection)
    function createPlayerBody() {
      playerNode = new BABYLON.TransformNode("playerNode", scene);

      avatarMaterials.head = new BABYLON.StandardMaterial("mHead", scene);
      avatarMaterials.torso = new BABYLON.StandardMaterial("mTorso", scene);
      avatarMaterials.lArm = new BABYLON.StandardMaterial("mLArm", scene);
      avatarMaterials.rArm = new BABYLON.StandardMaterial("mRArm", scene);
      avatarMaterials.lLeg = new BABYLON.StandardMaterial("mLLeg", scene);
      avatarMaterials.rLeg = new BABYLON.StandardMaterial("mRLeg", scene);

      applyAvatarColors();

      headMesh = BABYLON.MeshBuilder.CreateBox("head", { size: 0.8 }, scene);
      headMesh.position.y = 1.8;
      headMesh.material = avatarMaterials.head;
      headMesh.parent = playerNode;
      headMesh.isVisible = false;

      const torso = BABYLON.MeshBuilder.CreateBox("torso", { width: 1.0, height: 1.0, depth: 0.5 }, scene);
      torso.position.y = 0.9;
      torso.material = avatarMaterials.torso;
      torso.parent = playerNode;

      // Limbs swing from pivots placed at the joint (shoulder / hip) instead
      // of rotating the limb mesh about its own center. The pivot sits at
      // the torso's edge, and each limb mesh is offset downward inside its
      // pivot so the top of the limb stays locked to the torso while the
      // bottom swings freely — a proper shoulder/hip hinge.
      const shoulderY = 1.4; // top of torso
      const hipY = 0.4;      // bottom of torso

      lArmPivot = new BABYLON.TransformNode("lArmPivot", scene);
      lArmPivot.position = new BABYLON.Vector3(-0.725, shoulderY, 0);
      lArmPivot.parent = playerNode;

      lArmMesh = BABYLON.MeshBuilder.CreateBox("lArm", { width: 0.45, height: 1.0, depth: 0.45 }, scene);
      lArmMesh.position = new BABYLON.Vector3(0, -0.5, 0);
      lArmMesh.material = avatarMaterials.lArm;
      lArmMesh.parent = lArmPivot;

      rArmPivot = new BABYLON.TransformNode("rArmPivot", scene);
      rArmPivot.position = new BABYLON.Vector3(0.725, shoulderY, 0);
      rArmPivot.parent = playerNode;

      rArmMesh = BABYLON.MeshBuilder.CreateBox("rArm", { width: 0.45, height: 1.0, depth: 0.45 }, scene);
      rArmMesh.position = new BABYLON.Vector3(0, -0.5, 0);
      rArmMesh.material = avatarMaterials.rArm;
      rArmMesh.parent = rArmPivot;

      lLegPivot = new BABYLON.TransformNode("lLegPivot", scene);
      lLegPivot.position = new BABYLON.Vector3(-0.25, hipY, 0);
      lLegPivot.parent = playerNode;

      lLegMesh = BABYLON.MeshBuilder.CreateBox("lLeg", { width: 0.45, height: 1.0, depth: 0.45 }, scene);
      lLegMesh.position = new BABYLON.Vector3(0, -0.5, 0);
      lLegMesh.material = avatarMaterials.lLeg;
      lLegMesh.parent = lLegPivot;

      rLegPivot = new BABYLON.TransformNode("rLegPivot", scene);
      rLegPivot.position = new BABYLON.Vector3(0.25, hipY, 0);
      rLegPivot.parent = playerNode;

      rLegMesh = BABYLON.MeshBuilder.CreateBox("rLeg", { width: 0.45, height: 1.0, depth: 0.45 }, scene);
      rLegMesh.position = new BABYLON.Vector3(0, -0.5, 0);
      rLegMesh.material = avatarMaterials.rLeg;
      rLegMesh.parent = rLegPivot;
    }

    function applyAvatarColors() {
      avatarMaterials.head.diffuseColor = BABYLON.Color3.FromHexString(playerState.colors.head);
      avatarMaterials.torso.diffuseColor = BABYLON.Color3.FromHexString(playerState.colors.torso);
      avatarMaterials.lArm.diffuseColor = BABYLON.Color3.FromHexString(playerState.colors.lArm);
      avatarMaterials.rArm.diffuseColor = BABYLON.Color3.FromHexString(playerState.colors.rArm);
      avatarMaterials.lLeg.diffuseColor = BABYLON.Color3.FromHexString(playerState.colors.lLeg);
      avatarMaterials.rLeg.diffuseColor = BABYLON.Color3.FromHexString(playerState.colors.rLeg);
    }

    // HEAD-MOUNTED FLASHLIGHT / HEADLAMP
    // The physical lamp is modeled on the player but hidden from first-person view.
    // Only the light itself is visible through its illumination, and it sits above the eyes.
    let flashlightSpot, flashlightPoint, flashlightMesh, headlampBand, headlampHousing, headlampLens;
    let flashlightBobTime = 0;
    function setupFlashlight() {
      flashlightSpot = new BABYLON.SpotLight(
        "flSpot",
        new BABYLON.Vector3(0,0.68,0.02),
        new BABYLON.Vector3(0,0,1),
        Math.PI / 6.4,
        32,
        scene
      );
      flashlightSpot.intensity = 0;
      flashlightSpot.diffuse = new BABYLON.Color3(1.0,0.97,0.88);
      flashlightSpot.specular = new BABYLON.Color3(0.22,0.20,0.15);
      flashlightSpot.parent = camera;

      flashlightPoint = new BABYLON.PointLight("flPoint", new BABYLON.Vector3(0,0.75,0.02), scene);
      flashlightPoint.intensity = 0;
      flashlightPoint.range = 3.2;
      flashlightPoint.diffuse = new BABYLON.Color3(1.0,0.91,0.74);
      flashlightPoint.specular = new BABYLON.Color3(0.10,0.08,0.05);
      flashlightPoint.parent = camera;

      // First-person model is intentionally kept disabled so it cannot become an on-screen overlay.
      headlampBand = BABYLON.MeshBuilder.CreateTorus("headlampBand", {diameter:1.0, thickness:0.055, tessellation:32}, scene);
      headlampBand.scaling.y = 0.64;
      headlampBand.position = new BABYLON.Vector3(0,0.92,0.0);
      headlampBand.material = materials.duracellBlack;
      headlampBand.parent = playerNode;

      headlampHousing = BABYLON.MeshBuilder.CreateBox("headlampHousing", {width:0.34,height:0.18,depth:0.16}, scene);
      headlampHousing.position = new BABYLON.Vector3(0,2.30,0.08);
      headlampHousing.material = materials.metalDark;
      headlampHousing.parent = playerNode;

      headlampLens = BABYLON.MeshBuilder.CreateCylinder("headlampLens", {diameter:0.11,height:0.05}, scene);
      headlampLens.rotation.x = Math.PI/2;
      headlampLens.position = new BABYLON.Vector3(0,2.30,0.175);
      const lensMat = new BABYLON.StandardMaterial("headlampLensMat", scene);
      lensMat.diffuseColor = new BABYLON.Color3(0.95,0.95,0.88);
      lensMat.emissiveColor = new BABYLON.Color3(0.30,0.26,0.18);
      lensMat.specularColor = new BABYLON.Color3(0.16,0.16,0.12);
      headlampLens.material = lensMat;
      headlampLens.parent = playerNode;

      flashlightMesh = headlampHousing;
      headlampBand.setEnabled(false); headlampHousing.setEnabled(false); headlampLens.setEnabled(false);
    }

    // DOOR FRAME

      const rightPillar = BABYLON.MeshBuilder.CreateBox("fRight", { width: 0.25, height: 4.2, depth: 0.35 }, scene);
      rightPillar.position = new BABYLON.Vector3(1.3, 2.1, 0);

    // SEALED ELEVATOR WITH CEILING CONNECTION & UPRIGHT SIGN
    function buildBrokenElevator(parent, localPos) {
      const elNode = new BABYLON.TransformNode("brokenElevator", scene);
      elNode.position = localPos;
      elNode.parent = parent;

      const totalH = 6.5;

      const leftPillar = BABYLON.MeshBuilder.CreateBox("elFLeft", { width: 0.3, height: totalH, depth: 0.4 }, scene);
      leftPillar.position = new BABYLON.Vector3(-1.5, totalH / 2, 0);
      leftPillar.material = materials.metalDark;
      leftPillar.checkCollisions = true;
      leftPillar.parent = elNode;

      const rightPillar = BABYLON.MeshBuilder.CreateBox("elFRight", { width: 0.3, height: totalH, depth: 0.4 }, scene);
      rightPillar.position = new BABYLON.Vector3(1.5, totalH / 2, 0);
      rightPillar.material = materials.metalDark;
      rightPillar.checkCollisions = true;
      rightPillar.parent = elNode;

      const topHeader = BABYLON.MeshBuilder.CreateBox("elFTop", { width: 3.3, height: 2.3, depth: 0.4 }, scene);
      topHeader.position = new BABYLON.Vector3(0, totalH - 1.15, 0);
      topHeader.material = materials.metalDark;
      topHeader.checkCollisions = true;
      topHeader.parent = elNode;

      const solidBack = BABYLON.MeshBuilder.CreateBox("elBacking", { width: 3.0, height: totalH, depth: 0.1 }, scene);
      solidBack.position = new BABYLON.Vector3(0, totalH / 2, -0.2);
      solidBack.material = materials.metalDark;
      solidBack.checkCollisions = true;
      solidBack.parent = elNode;

      const doorL = BABYLON.MeshBuilder.CreateBox("elDoorL", { width: 1.4, height: 4.2, depth: 0.1 }, scene);
      doorL.position = new BABYLON.Vector3(-0.7, 2.1, -0.05);
      doorL.material = materials.elevatorDoor;
      doorL.checkCollisions = true;
      doorL.parent = elNode;

      const doorR = BABYLON.MeshBuilder.CreateBox("elDoorR", { width: 1.4, height: 4.2, depth: 0.1 }, scene);
      doorR.position = new BABYLON.Vector3(0.7, 2.1, -0.05);
      doorR.material = materials.elevatorDoor;
      doorR.checkCollisions = true;
      doorR.parent = elNode;

      // Correctly Oriented Sign
      const signMesh = BABYLON.MeshBuilder.CreateBox("elSign", { width: 2.2, height: 0.5, depth: 0.08 }, scene);
      signMesh.position = new BABYLON.Vector3(0, 4.8, 0.1);
      
      const dynamicTex = new BABYLON.DynamicTexture("elSignTex", { width: 512, height: 128 }, scene);
      dynamicTex.vScale = -1;
      const ctx = dynamicTex.getContext();
      ctx.fillStyle = "#111116";
      ctx.fillRect(0, 0, 512, 128);
      ctx.font = "bold 46px Arial";
      ctx.fillStyle = "#ff2222";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("OUT OF ORDER", 256, 64);
      dynamicTex.update();

      const signMat = new BABYLON.StandardMaterial("elSignMat", scene);
      signMat.diffuseTexture = dynamicTex;
      signMat.emissiveTexture = dynamicTex;
      signMat.specularColor = new BABYLON.Color3(0, 0, 0);
      signMesh.material = signMat;
      signMesh.parent = elNode;

      // Properly mounted above the elevator header, fully in front of the metal frame.
      const screenFrame = BABYLON.MeshBuilder.CreateBox("elScreenFrame", { width: 2.6, height: 0.76, depth: 0.12 }, scene);
      screenFrame.position = new BABYLON.Vector3(0, 6.05, 0.28);
      screenFrame.material = materials.metalDark;
      screenFrame.parent = elNode;

      signMesh.position = new BABYLON.Vector3(0, 6.05, 0.36);

      const screenGlow = new BABYLON.PointLight("elScreenGlow", new BABYLON.Vector3(0, 6.05, 0.52), scene);
      screenGlow.diffuse = new BABYLON.Color3(1.0, 0.04, 0.02);
      screenGlow.specular = new BABYLON.Color3(0.15, 0.01, 0.01);
      screenGlow.range = 4.5;
      screenGlow.intensity = 0.16;
      screenGlow.parent = elNode;

      scene.onBeforeRenderObservable.add(() => {
        if (Math.random() < 0.006) {
          const flicker = 0.55 + Math.random() * 0.45;
          signMat.emissiveColor = new BABYLON.Color3(0.8 * flicker, 0.015 * flicker, 0.01);
          screenGlow.intensity = 0.10 + Math.random() * 0.10;
        }
      });

      // Hazard tape replacing the old wood planks.
      const tapeTexture = new BABYLON.DynamicTexture("elevatorWarningTapeTex", {width:512,height:96}, scene);
      const tctx = tapeTexture.getContext();
      tctx.fillStyle = "#e5b900"; tctx.fillRect(0,0,512,96);
      tctx.fillStyle = "#151515";
      for (let x=-40; x<560; x+=80) {
        tctx.save();
        tctx.translate(x,0);
        tctx.rotate(-0.55);
        tctx.fillRect(0,-50,28,200);
        tctx.restore();
      }
      tapeTexture.update();
      const warningMat = new BABYLON.StandardMaterial("warningTapeMat", scene);
      warningMat.diffuseTexture = tapeTexture;
      warningMat.emissiveColor = new BABYLON.Color3(0.08,0.06,0.01);
      warningMat.specularColor = new BABYLON.Color3(0.04,0.04,0.04);

      [1.55, 2.35].forEach((yy, idx) => {
        const tape = BABYLON.MeshBuilder.CreateBox("warningTape_"+idx, { width: 3.2, height: 0.26, depth: 0.09 }, scene);
        tape.position = new BABYLON.Vector3(0, yy, 0.23);
        tape.material = warningMat;
        tape.parent = elNode;
      });
    }

    // FURNITURE & DECORATIONS
    function buildCornerTable(parent, localPos, withPlant = false) {
      const tNode = new BABYLON.TransformNode("cornerTable", scene);
      tNode.position = localPos;
      tNode.parent = parent;

      const top = BABYLON.MeshBuilder.CreateBox("tTop", { width: 1.6, height: 0.12, depth: 1.6 }, scene);
      top.position.y = 1.2;
      top.material = materials.tableWood;
      top.checkCollisions = true;
      top.parent = tNode;

      const legPositions = [[-0.6, 0.6, -0.6], [0.6, 0.6, -0.6], [-0.6, 0.6, 0.6], [0.6, 0.6, 0.6]];
      legPositions.forEach(p => {
        const leg = BABYLON.MeshBuilder.CreateBox("tLeg", { width: 0.12, height: 1.2, depth: 0.12 }, scene);
        leg.position = new BABYLON.Vector3(p[0], p[1], p[2]);
        leg.material = materials.tableWood;
        leg.checkCollisions = true;
        leg.parent = tNode;
      });

      if (withPlant) {
        buildPottedPlant(tNode, new BABYLON.Vector3(0, 1.26, 0));
      }

      return top;
    }

    function buildWallTable(parent, localPos, rotY = 0) {
      const tNode = new BABYLON.TransformNode("wallTable", scene);
      tNode.position = localPos;
      tNode.rotation.y = rotY;
      tNode.parent = parent;

      const top = BABYLON.MeshBuilder.CreateBox("tTop", { width: 3.6, height: 0.15, depth: 1.6 }, scene);
      top.position.y = 1.2;
      top.material = materials.tableWood;
      top.checkCollisions = true;
      top.parent = tNode;

      const legPositions = [[-1.6, 0.6, -0.6], [1.6, 0.6, -0.6], [-1.6, 0.6, 0.6], [1.6, 0.6, 0.6]];
      legPositions.forEach(p => {
        const leg = BABYLON.MeshBuilder.CreateBox("tLeg", { width: 0.14, height: 1.2, depth: 0.14 }, scene);
        leg.position = new BABYLON.Vector3(p[0], p[1], p[2]);
        leg.material = materials.tableWood;
        leg.checkCollisions = true;
        leg.parent = tNode;
      });

      return top;
    }

    function buildPottedPlant(parent, localPos) {
      const pNode = new BABYLON.TransformNode("pottedPlant", scene);
      pNode.position = localPos;
      pNode.parent = parent;

      const pot = BABYLON.MeshBuilder.CreateCylinder("pot", { diameterTop: 0.8, diameterBottom: 0.5, height: 0.9 }, scene);
      pot.position.y = 0.45;
      pot.material = materials.pot;
      pot.checkCollisions = true;
      pot.parent = pNode;

      // Loose grass-like leaves instead of a perfectly round hedge ball.
      for (let i = 0; i < 28; i++) {
        const blade = BABYLON.MeshBuilder.CreatePlane("grassBlade", { width: 0.08 + Math.random()*0.06, height: 0.55 + Math.random()*0.5 }, scene);
        const angle = Math.random()*Math.PI*2;
        const radius = Math.random()*0.26;
        blade.position = new BABYLON.Vector3(
          Math.cos(angle)*radius,
          0.93 + Math.random()*0.20,
          Math.sin(angle)*radius
        );
        blade.rotation.y = angle;
        blade.rotation.z = (Math.random()-0.5)*0.35;
        blade.material = materials.leaf;
        blade.isPickable = false;
        blade.parent = pNode;
      }
    }

    function buildRadio(parent, localPos) {
      const radioNode = new BABYLON.TransformNode("radio", scene);
      radioNode.position = localPos;
      radioNode.parent = parent;
      radioNode.rotation.y = Math.PI / 4;

      const body = BABYLON.MeshBuilder.CreateBox("radioBody", {width:0.8, height:0.42, depth:0.42}, scene);
      body.material = materials.metalDark;
      body.parent = radioNode;

      const front = BABYLON.MeshBuilder.CreateBox("radioFront", {width:0.62, height:0.23, depth:0.05}, scene);
      front.position = new BABYLON.Vector3(0,0.02,0.235);
      const frontMat = new BABYLON.StandardMaterial("radioFrontMat", scene);
      frontMat.diffuseColor = new BABYLON.Color3(0.055,0.055,0.06);
      front.material = frontMat;
      front.parent = radioNode;

      const speaker = BABYLON.MeshBuilder.CreateCylinder("radioSpeaker", {diameter:0.16, height:0.045, tessellation:24}, scene);
      speaker.rotation.x = Math.PI/2;
      speaker.position = new BABYLON.Vector3(-0.18,0.02,0.27);
      speaker.material = materials.blackGrid;
      speaker.parent = radioNode;

      const knob1 = BABYLON.MeshBuilder.CreateCylinder("radioKnob1", {diameter:0.09, height:0.05, tessellation:18}, scene);
      knob1.rotation.x = Math.PI/2;
      knob1.position = new BABYLON.Vector3(0.18,0.05,0.27);
      knob1.material = materials.metalLocker;
      knob1.parent = radioNode;

      const knob2 = BABYLON.MeshBuilder.CreateCylinder("radioKnob2", {diameter:0.07, height:0.05, tessellation:18}, scene);
      knob2.rotation.x = Math.PI/2;
      knob2.position = new BABYLON.Vector3(0.29,-0.06,0.27);
      knob2.material = materials.metalLocker;

    // INDUSTRIAL SHELF RACK (NON-OVERLAPPING BOXES)
    function buildWarehouseRack(parentRoom, localPos, rotY) {
      const rackNode = new BABYLON.TransformNode("warehouseRack", scene);
      rackNode.position = localPos;
      rackNode.rotation.y = rotY;
      rackNode.parent = parentRoom;

      const rw = 3.6, rh = 3.2, rd = 1.2;

      const p1 = BABYLON.MeshBuilder.CreateBox("rp1", { width: 0.12, height: rh, depth: 0.12 }, scene);
      p1.position = new BABYLON.Vector3(-rw/2 + 0.1, rh/2, -rd/2 + 0.1);
      p1.material = materials.metalRack;
      p1.checkCollisions = true;
      p1.parent = rackNode;

      const p2 = BABYLON.MeshBuilder.CreateBox("rp2", { width: 0.12, height: rh, depth: 0.12 }, scene);
      p2.position = new BABYLON.Vector3(rw/2 - 0.1, rh/2, -rd/2 + 0.1);
      p2.material = materials.metalRack;
      p2.checkCollisions = true;
      p2.parent = rackNode;

      const p3 = BABYLON.MeshBuilder.CreateBox("rp3", { width: 0.12, height: rh, depth: 0.12 }, scene);
      p3.position = new BABYLON.Vector3(-rw/2 + 0.1, rh/2, rd/2 - 0.1);
      p3.material = materials.metalRack;
      p3.checkCollisions = true;
      p3.parent = rackNode;

      const p4 = BABYLON.MeshBuilder.CreateBox("rp4", { width: 0.12, height: rh, depth: 0.12 }, scene);
      p4.position = new BABYLON.Vector3(rw/2 - 0.1, rh/2, rd/2 - 0.1);
      p4.material = materials.metalRack;
      p4.checkCollisions = true;
      p4.parent = rackNode;

      const shelfYPositions = [0.4, 1.5, 2.6];
      const validBatterySurfaces = [];

      shelfYPositions.forEach(sy => {
        const shelf = BABYLON.MeshBuilder.CreateBox("rShelf", { width: rw, height: 0.08, depth: rd }, scene);
        shelf.position = new BABYLON.Vector3(0, sy, 0);
        shelf.material = materials.metalRack;
        shelf.checkCollisions = true;
        shelf.parent = rackNode;

        if (sy < 2.0) {
          validBatterySurfaces.push(shelf);
        }

        // Spawn boxes with strict non-clipping boundary logic
        const numBoxes = Math.floor(Math.random() * 3);
        const occupiedRanges = [];

        for (let i = 0; i < numBoxes; i++) {
          const bw = 0.5 + Math.random() * 0.5;
          const bh = 0.4 + Math.random() * 0.4;
          const bd = 0.5 + Math.random() * 0.4;

          let candidateX = 0;
          let validPos = false;
          let attempts = 0;

          while (attempts < 12 && !validPos) {
            candidateX = -rw/2 + 0.6 + Math.random() * (rw - 1.2);
            validPos = true;
            for (let rng of occupiedRanges) {
              if (Math.abs(candidateX - rng.x) < (rng.halfW + bw/2 + 0.12)) {
                validPos = false;
                break;
              }
            }
            attempts++;
          }

          if (validPos) {
            occupiedRanges.push({ x: candidateX, halfW: bw/2 });
            const box = BABYLON.MeshBuilder.CreateBox("cBox", { width: bw, height: bh, depth: bd }, scene);
            box.position = new BABYLON.Vector3(candidateX, sy + 0.04 + bh/2, (Math.random() - 0.5) * 0.2);
            box.rotation.y = (Math.random() - 0.5) * 0.3;
            box.material = materials.cardboard;
            box.checkCollisions = true;
            box.parent = rackNode;
          }
        }
      });

      return validBatterySurfaces;
    }

    // LOCKERS
    function buildMetalLocker(parentRoom, localPos, rotY) {
      const lockerGroup = new BABYLON.TransformNode("lockerGroup", scene);

      const cabinetY = pedestalH + (lockerH-pedestalH)/2;

      const backWall = BABYLON.MeshBuilder.CreateBox("lBack", { width: lockerW, height: lockerH-pedestalH, depth: 0.08 }, scene);
      backWall.position = new BABYLON.Vector3(0, cabinetY, -lockerD/2+0.04);
      backWall.material = materials.metalLocker; backWall.checkCollisions = true; backWall.parent = lockerGroup;

      const leftWall = BABYLON.MeshBuilder.CreateBox("lLeft", { width: 0.08, height: lockerH-pedestalH, depth: lockerD }, scene);
      leftWall.position = new BABYLON.Vector3(-lockerW/2+0.04, cabinetY, 0);
      leftWall.material = materials.metalLocker; leftWall.checkCollisions = true; leftWall.parent = lockerGroup;

      const rightWall = BABYLON.MeshBuilder.CreateBox("lRight", { width: 0.08, height: lockerH-pedestalH, depth: lockerD }, scene);
      rightWall.position = new BABYLON.Vector3(lockerW/2-0.04, cabinetY, 0);
      rightWall.material = materials.metalLocker; rightWall.checkCollisions = true; rightWall.parent = lockerGroup;

      const topRoof = BABYLON.MeshBuilder.CreateBox("lTop", { width: lockerW, height: 0.08, depth: lockerD }, scene);
      topRoof.position = new BABYLON.Vector3(0, lockerH-0.04, 0);
      topRoof.material = materials.metalLocker; topRoof.checkCollisions = true; topRoof.parent = lockerGroup;

      const doorPivot = new BABYLON.TransformNode("lockerDoorPivot", scene);
      doorPivot.position = new BABYLON.Vector3(-lockerW/2+0.05, cabinetY, lockerD/2-0.05);
      doorPivot.parent = lockerGroup;

      const doorFrameWidth = lockerW-0.1;
      const doorFrameHeight = lockerH-pedestalH-0.05;

      const doorLower = BABYLON.MeshBuilder.CreateBox("dLower", {
        width: doorFrameWidth, height: doorFrameHeight-0.7, depth: 0.06
      }, scene);
      doorLower.position = new BABYLON.Vector3(doorFrameWidth/2, -(0.7/2), 0);
      doorLower.material = materials.metalLocker; doorLower.checkCollisions = true; doorLower.parent = doorPivot;

      const doorTopBorder = BABYLON.MeshBuilder.CreateBox("dTopBorder", { width: doorFrameWidth, height: 0.15, depth: 0.06 }, scene);
      doorTopBorder.position = new BABYLON.Vector3(doorFrameWidth/2, doorFrameHeight/2-0.075, 0);
      doorTopBorder.material = materials.metalLocker; doorTopBorder.checkCollisions = true; doorTopBorder.parent = doorPivot;

      const doorLeftBorder = BABYLON.MeshBuilder.CreateBox("dLBorder", { width: 0.2, height: 0.55, depth: 0.06 }, scene);
      doorLeftBorder.position = new BABYLON.Vector3(0.1, doorFrameHeight/2-0.425, 0);
      doorLeftBorder.material = materials.metalLocker; doorLeftBorder.checkCollisions = true; doorLeftBorder.parent = doorPivot;

      const doorRightBorder = BABYLON.MeshBuilder.CreateBox("dRBorder", { width: 0.2, height: 0.55, depth: 0.06 }, scene);
      doorRightBorder.position = new BABYLON.Vector3(doorFrameWidth-0.1, doorFrameHeight/2-0.425, 0);
      doorRightBorder.material = materials.metalLocker; doorRightBorder.checkCollisions = true; doorRightBorder.parent = doorPivot;

      const ventSlatYPositions = [doorFrameHeight/2-0.22, doorFrameHeight/2-0.35, doorFrameHeight/2-0.48];
      const ventSlats = [];
      ventSlatYPositions.forEach(sy => {
        const slat = BABYLON.MeshBuilder.CreateBox("vSlat", { width: doorFrameWidth-0.4, height: 0.05, depth: 0.05 }, scene);
        slat.position = new BABYLON.Vector3(doorFrameWidth/2, sy, 0);
        slat.rotation.x = 0.3;
        slat.material = materials.metalLocker;
        slat.parent = doorPivot;
        slat.checkCollisions = false;
        ventSlats.push(slat);
      });

      // Simple locker handle / knob.
      const handle = BABYLON.MeshBuilder.CreateCylinder("lockerHandle", { diameter: 0.10, height: 0.12, tessellation: 16 }, scene);
      handle.rotation.x = Math.PI/2;
      handle.position = new BABYLON.Vector3(doorFrameWidth-0.28, 0.1, -0.06);
      handle.material = materials.metalDark;
      handle.parent = doorPivot;

      let isOpen = false;
      let lockerEntry = null;
      const doorCollisionParts = [doorLower, doorTopBorder, doorLeftBorder, doorRightBorder];

      lockerEntry = {
        mesh: doorLower,
        type: 'locker',
        distance: 3.2,
        prompt: "Open Locker",
        action: () => {
          isOpen = !isOpen;
          lockerEntry.prompt = isOpen ? "Close Locker" : "Open Locker";

          const targetRot = isOpen ? -Math.PI/2.1 : 0;
          const startRot = doorPivot.rotation.y;
          if (isOpen) doorCollisionParts.forEach(m => m.checkCollisions = false);

          BABYLON.Animation.CreateAndStartAnimation(
            "lockerDoorSwing", doorPivot, "rotation.y", 30, 15,
            startRot, targetRot, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT,
            null,
            () => {
              if (!isOpen) doorCollisionParts.forEach(m => m.checkCollisions = true);
            }
          );
        }
      };
      interactables.push(lockerEntry);

      // 20% chance of a battery sitting directly on the locker base, inside the cabinet.
      if (Math.random() < 0.20) {
        buildBatteryPickup(lockerGroup, new BABYLON.Vector3(
          (Math.random()-0.5) * 0.95,
          0.20,
          -0.36 + (Math.random()-0.5)*0.14
        ));
      }
      return lockerGroup;
    }

    function buildDoor(parentRoom, localPos, signText, roomIndex) {
      createWoodenDoorFrame(parentRoom, localPos);

      const doorPivot = new BABYLON.TransformNode("doorPivot", scene);
      doorPivot.position = localPos.add(new BABYLON.Vector3(-1.2, 0, 0));
      doorPivot.parent = parentRoom;

      const doorMesh = BABYLON.MeshBuilder.CreateBox("doorMesh", { width: 2.4, height: 4.0, depth: 0.15 }, scene);
      doorMesh.position = new BABYLON.Vector3(1.2, 2.0, 0);
      doorMesh.material = materials.doorWood;
      doorMesh.checkCollisions = true;
      doorMesh.parent = doorPivot;

      // Every door gets a real, simple metal doorknob.
      const knobBack = BABYLON.MeshBuilder.CreateCylinder("doorKnobBack", {diameter:0.18,height:0.035,tessellation:20}, scene);
      knobBack.rotation.x = Math.PI/2;
      knobBack.position = new BABYLON.Vector3(2.0,2.02,-0.11);
      knobBack.material = materials.metalDark;
      knobBack.parent = doorPivot;

      const knob = BABYLON.MeshBuilder.CreateSphere("doorKnob", {diameter:0.13,segments:20}, scene);
      knob.position = new BABYLON.Vector3(2.04,2.02,-0.19);
      knob.material = materials.metalLocker;
      knob.parent = doorPivot;

      const signMesh = BABYLON.MeshBuilder.CreateBox("signMesh", { width: 1.6, height: 0.6, depth: 0.08 }, scene);
      signMesh.position = localPos.add(new BABYLON.Vector3(0, 4.85, -0.15));
      signMesh.material = materials.plasticYellow;
      signMesh.parent = parentRoom;

      const dynamicTex = new BABYLON.DynamicTexture("signTex", { width: 256, height: 128 }, scene);
      dynamicTex.drawText(signText, null, 80, "bold 60px Arial", "black", "#f39c12", true);
      const signMat = new BABYLON.StandardMaterial("signMat", scene);
      signMat.diffuseTexture = dynamicTex;
      signMat.specularColor = new BABYLON.Color3(0, 0, 0);
      signMesh.material = signMat;

      let doorInteractionEntry = null;
      let opening = false;

      doorInteractionEntry = {
        mesh: doorMesh,
        type: 'door',
        distance: 3.5,
        prompt: "Open Door",
        action: () => {
          if (opening) return;
          opening = true;

          const idx = interactables.indexOf(doorInteractionEntry);
          if (idx !== -1) interactables.splice(idx, 1);
          if (currentPromptTarget === doorInteractionEntry) {
            currentPromptTarget = null;
            document.getElementById('interactionPrompt').style.display = 'none';
          }

          doorMesh.checkCollisions = false;

          playDoorSoundSequence((openDuration) => {
            // Generate the next room immediately as the door begins its slow opening.
            if (playerState.currentRoomIndex === roomIndex) {
              playerState.currentRoomIndex++;
              generateNextRoom(parentRoom.position.z + localPos.z, playerState.currentRoomIndex);
            }

            BABYLON.Animation.CreateAndStartAnimation(
              "doorOpen", doorPivot, "rotation.y", 30,
              Math.round(Math.max(40, openDuration / 1000 * 30)),
              0, -Math.PI/2,
              BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT
            );
          });
        }
      };

      interactables.push(doorInteractionEntry);
    }

    // ROOM GENERATOR WITH GREY WOOD CEILING & NO SHELF CLIPPING
    function generateNextRoom(entryZ, roomIndex) {
      const roomGroup = new BABYLON.TransformNode("room_" + roomIndex, scene);
      
      const roomType = Math.floor(Math.random() * 4);
      let roomWidth = 12, roomLength = 18;

      if (roomType === 1) { roomWidth = 10; roomLength = 22; }
      else if (roomType === 2) { roomWidth = 16; roomLength = 20; }
      else if (roomType === 3) { roomWidth = 12; roomLength = 16; }

      const roomHeight = 6.0;
      roomGroup.position = new BABYLON.Vector3(0, 0, entryZ + roomLength / 2);

      const floor = BABYLON.MeshBuilder.CreatePlane("floor", { width: roomWidth, height: roomLength }, scene);
      floor.rotation.x = Math.PI / 2;
      floor.material = materials.carpet;
      floor.checkCollisions = true;
      floor.parent = roomGroup;

      const ceiling = BABYLON.MeshBuilder.CreatePlane("ceil", { width: roomWidth, height: roomLength }, scene);
      ceiling.rotation.x = -Math.PI / 2;
      ceiling.position.y = roomHeight;
      ceiling.material = materials.ceilingWood;
      ceiling.checkCollisions = true;
      ceiling.parent = roomGroup;

      const lW = BABYLON.MeshBuilder.CreateBox("lW", { width: 0.3, height: roomHeight, depth: roomLength }, scene);
      lW.position = new BABYLON.Vector3(-roomWidth / 2, roomHeight / 2, 0);
      lW.material = materials.wallWood;
      lW.checkCollisions = true;
      lW.parent = roomGroup;

      const rW = BABYLON.MeshBuilder.CreateBox("rW", { width: 0.3, height: roomHeight, depth: roomLength }, scene);
      rW.position = new BABYLON.Vector3(roomWidth / 2, roomHeight / 2, 0);
      rW.material = materials.wallWood;
      rW.checkCollisions = true;
      rW.parent = roomGroup;

      const bwL = BABYLON.MeshBuilder.CreateBox("bwL", { width: (roomWidth - 2.8) / 2, height: roomHeight, depth: 0.3 }, scene);
      bwL.position = new BABYLON.Vector3(-(roomWidth - 2.8) / 4 - 1.4, roomHeight / 2, -roomLength / 2);
      bwL.material = materials.wallWood;
      bwL.checkCollisions = true;
      bwL.parent = roomGroup;

      const bwR = BABYLON.MeshBuilder.CreateBox("bwR", { width: (roomWidth - 2.8) / 2, height: roomHeight, depth: 0.3 }, scene);
      bwR.position = new BABYLON.Vector3((roomWidth - 2.8) / 4 + 1.4, roomHeight / 2, -roomLength / 2);
      bwR.material = materials.wallWood;
      bwR.checkCollisions = true;
      bwR.parent = roomGroup;

      const bwT = BABYLON.MeshBuilder.CreateBox("bwT", { width: 2.8, height: roomHeight - 4.2, depth: 0.3 }, scene);
      bwT.position = new BABYLON.Vector3(0, 4.2 + (roomHeight - 4.2) / 2, -roomLength / 2);
      bwT.material = materials.wallWood;
      bwT.checkCollisions = true;
      bwT.parent = roomGroup;

      const fwL = BABYLON.MeshBuilder.CreateBox("fwL", { width: (roomWidth - 2.8) / 2, height: roomHeight, depth: 0.3 }, scene);
      fwL.position = new BABYLON.Vector3(-(roomWidth - 2.8) / 4 - 1.4, roomHeight / 2, roomLength / 2);
      fwL.material = materials.wallWood;
      fwL.checkCollisions = true;
      fwL.parent = roomGroup;

      const fwR = BABYLON.MeshBuilder.CreateBox("fwR", { width: (roomWidth - 2.8) / 2, height: roomHeight, depth: 0.3 }, scene);
      fwR.position = new BABYLON.Vector3((roomWidth - 2.8) / 4 + 1.4, roomHeight / 2, roomLength / 2);
      fwR.material = materials.wallWood;
      fwR.checkCollisions = true;
      fwR.parent = roomGroup;

      const fwT = BABYLON.MeshBuilder.CreateBox("fwT", { width: 2.8, height: roomHeight - 4.2, depth: 0.3 }, scene);
      fwT.position = new BABYLON.Vector3(0, 4.2 + (roomHeight - 4.2) / 2, roomLength / 2);
      fwT.material = materials.wallWood;
      fwT.checkCollisions = true;
      fwT.parent = roomGroup;

      const signLabel = "A-" + String(roomIndex).padStart(3, '0');
      buildDoor(roomGroup, new BABYLON.Vector3(0, 0, roomLength / 2), signLabel, roomIndex);

      // Batteries may only spawn on explicitly registered solid surfaces.
      const surfaceSpawnLocations = [];

      const corner1HasPlant = Math.random() < 0.5;
      const corner2HasPlant = Math.random() < 0.5;
      const corner1 = buildCornerTable(roomGroup, new BABYLON.Vector3(-roomWidth / 2 + 1.2, 0, -roomLength / 2 + 1.2), corner1HasPlant);
      const corner2 = buildCornerTable(roomGroup, new BABYLON.Vector3(roomWidth / 2 - 1.2, 0, -roomLength / 2 + 1.2), corner2HasPlant);
      if (!corner1HasPlant) surfaceSpawnLocations.push(corner1.absolutePosition.add(new BABYLON.Vector3(0, 0.16, 0)));
      if (!corner2HasPlant) surfaceSpawnLocations.push(corner2.absolutePosition.add(new BABYLON.Vector3(0, 0.16, 0)));

      // Floor is a real solid surface, so this location is safe and never floats.
      surfaceSpawnLocations.push(new BABYLON.Vector3(
        (Math.random() - 0.5) * (roomWidth - 4),
        0.13,
        (Math.random() - 0.5) * (roomLength - 4)
      ));

      // Non-clipping furniture layouts
      if (roomType === 0 || roomType === 2) {
        const wTable1 = buildWallTable(roomGroup, new BABYLON.Vector3(-roomWidth / 2 + 1.1, 0, -2.5), Math.PI / 2);
        surfaceSpawnLocations.push(wTable1.absolutePosition.add(new BABYLON.Vector3(0, 0.16, 0)));
      }

      if (roomType === 1 || roomType === 3) {
        buildMetalLocker(roomGroup, new BABYLON.Vector3(roomWidth / 2 - 1.3, 0, -2.5), -Math.PI / 2);
      }

      if (roomType === 2 || roomType === 3) {
        const rackShelves = buildWarehouseRack(roomGroup, new BABYLON.Vector3(-roomWidth / 2 + 1.1, 0, 3.0), Math.PI / 2);
        rackShelves.forEach(sh => {
          surfaceSpawnLocations.push(sh.absolutePosition.add(new BABYLON.Vector3(0, 0.16, 0)));
        });
      }

      if (Math.random() < 0.20 && surfaceSpawnLocations.length > 0) {
        const chosenLoc = surfaceSpawnLocations[Math.floor(Math.random() * surfaceSpawnLocations.length)];
        buildBatteryPickup(roomGroup, chosenLoc);
      }

      const darknessFactor = Math.max(0.065, 0.36 - roomIndex * 0.018);
      const roomLight = new BABYLON.PointLight("rLight_" + roomIndex, new BABYLON.Vector3(0, roomHeight - 1, 0), scene);
      roomLight.intensity = darknessFactor;
      roomLight.range = 18;
      roomLight.diffuse = new BABYLON.Color3(0.78,0.79,0.76);
      roomLight.specular = new BABYLON.Color3(0.12,0.12,0.12);
      roomLight.parent = roomGroup;

      activeRooms.push(roomGroup);

      if (activeRooms.length > 5) {
        const oldRoom = activeRooms.shift();
        oldRoom.dispose();
      }
    }

    // SOFA ACTIONS WITH AUTOMATIC ROBLOX SEAT POSE
    function sitOnSofa(sofaMesh, isRightSofa) {
      if (playerState.isSitting) return;
      playerState.isSitting = true;

      const seatPos = sofaMesh.absolutePosition;
      
      // Face forward relative to the sofa orientation
      camera.rotation.y = isRightSofa ? -Math.PI / 2 : Math.PI / 2;
      camera.rotation.x = 0;

      camera.position.set(seatPos.x, seatPos.y + 0.9, seatPos.z);
      playerNode.position.set(seatPos.x, seatPos.y + 0.1, seatPos.z);
      playerNode.rotation.y = camera.rotation.y;

      // Lay legs flat on sofa & point arms straight out (Roblox Seat Pose)
      lLegPivot.rotation.x = -Math.PI / 2;
      rLegPivot.rotation.x = -Math.PI / 2;
      lArmPivot.rotation.x = -Math.PI / 2;
      rArmPivot.rotation.x = -Math.PI / 2;

      document.getElementById('jumpBtn').style.display = 'flex';
    }

    function standUpFromSofa() {
      if (!playerState.isSitting) return;
      playerState.isSitting = false;

      // Restore limbs back to normal standing orientation
      lLegPivot.rotation.x = 0;
      rLegPivot.rotation.x = 0;
      lArmPivot.rotation.x = 0;
      rArmPivot.rotation.x = 0;

      const yaw = camera.rotation.y;
      const forwardDir = new BABYLON.Vector3(Math.sin(yaw), 0, Math.cos(yaw));

      camera.position.addInPlace(forwardDir.scale(1.2));
      camera.position.y = 2.2;

      playerNode.position.x = camera.position.x;
      playerNode.position.z = camera.position.z;

      document.getElementById('jumpBtn').style.display = 'none';
    }

    // CONTROLS & BINDINGS
    function setupControls() {
      window.addEventListener('keydown', (e) => {
        keysPressed[e.code] = true;

        if (e.code === 'KeyE' && currentPromptTarget) {
          currentPromptTarget.action();
        }
        if (e.code === 'Space' && playerState.isSitting) {
          standUpFromSofa();
        }
        if (e.code === 'KeyF' && playerState.holdingFlashlight) {
          toggleFlashlight();
        }
      });

      window.addEventListener('keyup', (e) => {
        keysPressed[e.code] = false;
      });

      canvas.addEventListener('click', () => {
        if (!isMobile && document.pointerLockElement !== canvas) {
          canvas.requestPointerLock();
        }
        if (playerState.holdingFlashlight) {
          toggleFlashlight();
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === canvas) {
          camera.rotation.y += e.movementX * 0.0022;
          camera.rotation.x += e.movementY * 0.0022;
          camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
        }
      });

      if (isMobile) {
        document.getElementById('mobileControls').style.display = 'block';
        setupMobileTouchEvents();
      }

      document.getElementById('slotFlashlight').addEventListener('click', (e) => {
        e.stopPropagation();
        playerState.holdingFlashlight = !playerState.holdingFlashlight;
        const slot = document.getElementById('slotFlashlight');
        const batWidget = document.getElementById('batteryWidget');

        if (playerState.holdingFlashlight) {
          slot.classList.add('active');
          headlampBand.setEnabled(false); headlampHousing.setEnabled(false); headlampLens.setEnabled(false); flashlightMesh.setEnabled(false);
          batWidget.classList.remove('hidden');
          if (playerState.batteryLevel > 0) { playerState.flashlightOn = true; flashlightSpot.intensity = 3.1; flashlightPoint.intensity = 0.55; }
        } else {
          slot.classList.remove('active');
          headlampBand.setEnabled(false); headlampHousing.setEnabled(false); headlampLens.setEnabled(false); flashlightMesh.setEnabled(false);
          batWidget.classList.add('hidden'); playerState.flashlightOn = false; flashlightSpot.intensity = 0; flashlightPoint.intensity = 0;
        }
        updateBatteryUI();
      });

      document.getElementById('jumpBtn').addEventListener('click', standUpFromSofa);
    }

    function setupMobileTouchEvents() {
      const joystickContainer = document.getElementById('joystickContainer');
      const joystickKnob = document.getElementById('joystickKnob');
      let joyTouchId = null;
      let startX, startY;

      joystickContainer.addEventListener('touchstart', (e) => {
        const touch = e.changedTouches[0];
        joyTouchId = touch.identifier;
        startX = touch.clientX;
        startY = touch.clientY;
      });

      joystickContainer.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === joyTouchId) {
            const touch = e.changedTouches[i];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;
            const dist = Math.min(40, Math.hypot(dx, dy));
            const angle = Math.atan2(dy, dx);

            const knobX = Math.cos(angle) * dist;
            const knobY = Math.sin(angle) * dist;
            joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

            moveInput.x = knobX / 40;
            moveInput.z = -knobY / 40;
          }
        }
      });

      const resetJoystick = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === joyTouchId) {
            joyTouchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            moveInput.x = 0;
            moveInput.z = 0;
          }
        }
      };

      joystickContainer.addEventListener('touchend', resetJoystick);
      joystickContainer.addEventListener('touchcancel', resetJoystick);

      const touchZone = document.getElementById('touchCameraZone');
      let lookTouchId = null;
      let lastX, lastY;
      let touchMoved = false;

      touchZone.addEventListener('touchstart', (e) => {
        const touch = e.changedTouches[0];
        lookTouchId = touch.identifier;
        lastX = touch.clientX;
        lastY = touch.clientY;
        touchMoved = false;
      });

      touchZone.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === lookTouchId) {
            const touch = e.changedTouches[i];
            const dx = touch.clientX - lastX;
            const dy = touch.clientY - lastY;

            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) touchMoved = true;

            camera.rotation.y += dx * 0.005;
            camera.rotation.x += dy * 0.005;
            camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));

            lastX = touch.clientX;
            lastY = touch.clientY;
          }
        }
      });

      const resetLook = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === lookTouchId) {
            lookTouchId = null;
            if (!touchMoved && playerState.holdingFlashlight) {
              toggleFlashlight();
            }
          }
        }
      };

      touchZone.addEventListener('touchend', resetLook);
      touchZone.addEventListener('touchcancel', resetLook);
    }

    function toggleFlashlight() {
      if (playerState.batteryLevel <= 0) {
        playerState.flashlightOn = false;
        flashlightSpot.intensity = 0; flashlightPoint.intensity = 0;
        return;
      }
      playerState.flashlightOn = !playerState.flashlightOn;
      flashlightSpot.intensity = playerState.flashlightOn ? 3.1 : 0;
      flashlightPoint.intensity = playerState.flashlightOn ? 0.55 : 0;
    }

    function updateBatteryUI() {
      document.getElementById('batteryCount').innerText = "x" + playerState.batteriesCount;

      const bars = [document.getElementById('bBar1'), document.getElementById('bBar2'), document.getElementById('bBar3')];
      const level = Math.ceil(playerState.batteryLevel);

      for (let i = 0; i < 3; i++) {
        if (i < level) {
          bars[i].classList.remove('empty');
        } else {
          bars[i].classList.add('empty');
        }
      }
    }

    // SLOWER BATTERY DRAIN SPEED
    function processBatteryDrain(dt) {
      if (playerState.flashlightOn && playerState.holdingFlashlight) {
        playerState.batteryLevel -= dt * 0.018; // Drains ~3.3x slower

        if (playerState.batteryLevel <= 0) {
          playerState.batteryLevel = 0;
          playerState.flashlightOn = false;

          let flickers = 0;
          const flickerInt = setInterval(() => {
            flashlightSpot.intensity = (flickers % 2 === 0) ? 1.8 : 0;
            flashlightPoint.intensity = (flickers % 2 === 0) ? 0.28 : 0;
            flickers++;
            if (flickers > 5) {
              clearInterval(flickerInt);
              flashlightSpot.intensity = 0; flashlightPoint.intensity = 0;

              if (playerState.batteriesCount > 0) {
                playerState.batteriesCount--;
                playerState.batteryLevel = 3.0;
                playerState.flashlightOn = true;
                flashlightSpot.intensity = 3.1; flashlightPoint.intensity = 0.55;
              }
              updateBatteryUI();
            }
          }, 100);
        }
        updateBatteryUI();
      }
    }

    // GAME LOOP WITH ROBLOX-STYLE WALKING ANIMATIONS
    function gameUpdateLoop() {
      const dt = engine.getDeltaTime() / 1000;

      if (!playerState.isSitting) {
        let inputX = moveInput.x;
        let inputZ = moveInput.z;

        if (keysPressed['KeyW']) inputZ = 1;
        if (keysPressed['KeyS']) inputZ = -1;
        if (keysPressed['KeyA']) inputX = -1;
        if (keysPressed['KeyD']) inputX = 1;

        if (inputX !== 0 || inputZ !== 0) {
          const speed = 4.2 * dt;
          const yaw = camera.rotation.y;

          const forwardX = Math.sin(yaw);
          const forwardZ = Math.cos(yaw);
          const rightX = Math.cos(yaw);
          const rightZ = -Math.sin(yaw);

          let moveVectorX = (forwardX * inputZ) + (rightX * inputX);
          let moveVectorZ = (forwardZ * inputZ) + (rightZ * inputX);

          const mag = Math.hypot(moveVectorX, moveVectorZ);
          if (mag > 0) {
            moveVectorX = (moveVectorX / mag) * speed;
            moveVectorZ = (moveVectorZ / mag) * speed;
          }

          camera.cameraDirection.x = moveVectorX;
          camera.cameraDirection.z = moveVectorZ;

          // Roblox Walking limb swing animation — pivots are anchored at the
          // shoulders/hips, so this swings the limbs from the joint instead
          // of sliding the whole mesh away from the torso.
          walkAnimTime += dt * 9.5;
          const swing = Math.sin(walkAnimTime) * 0.55;
          lArmPivot.rotation.x = swing;
          rArmPivot.rotation.x = -swing;
          lLegPivot.rotation.x = -swing;
          rLegPivot.rotation.x = swing;
        } else {
          camera.cameraDirection.x = 0;
          camera.cameraDirection.z = 0;

          // Smoothly reset limbs back to 0 when idle
          lArmPivot.rotation.x *= 0.8;
          rArmPivot.rotation.x *= 0.8;
          lLegPivot.rotation.x *= 0.8;
          rLegPivot.rotation.x *= 0.8;
        }

        // Natural headlamp bob: both the directional beam and point-light spill subtly move with footsteps.
        const movingNow = (inputX !== 0 || inputZ !== 0);
        flashlightBobTime += dt * (movingNow ? 10.5 : 2.0);
        const bobY = Math.sin(flashlightBobTime) * (movingNow ? 0.075 : 0.010);
        const bobX = movingNow ? Math.sin(flashlightBobTime * 0.5) * 0.026 : 0;
        flashlightSpot.position.x = bobX; flashlightSpot.position.y = 0.68 + bobY;
        flashlightPoint.position.x = bobX * 0.65; flashlightPoint.position.y = 0.75 + bobY * 0.92;

        playerNode.position.x = camera.position.x;
        playerNode.position.z = camera.position.z;
        playerNode.rotation.y = camera.rotation.y;
      }

      processBatteryDrain(dt);
      updateRadioAudio();
      checkInteractables();
    }

    // CIRCULAR INTERACT BUTTON WITH DYNAMIC ICONS
    function checkInteractables() {
      let closest = null;
      let minDist = 999;

      for (let i = interactables.length - 1; i >= 0; i--) {
        const item = interactables[i];
        if (item.mesh.isDisposed()) {
          interactables.splice(i, 1);
          continue;
        }

        const dist = BABYLON.Vector3.Distance(camera.position, item.mesh.absolutePosition);
        if (dist <= item.distance && dist < minDist) {
          minDist = dist;
          closest = item;
        }
      }

      const promptUI = document.getElementById('interactionPrompt');
      if (closest) {
        currentPromptTarget = closest;
        promptUI.style.display = 'flex';

        // Render black SVG icons based on target type
        if (closest.type === 'door') {
          promptUI.innerHTML = `<svg viewBox="0 0 24 24"><path fill="black" d="M19 19V5c0-1.1-.9-2-2-2H7c-1.1 0-2 .9-2 2v14H3v2h18v-2h-2zm-4-6c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>`;
        } else if (closest.type === 'battery') {
          promptUI.innerHTML = `<svg viewBox="0 0 24 24" style="transform: rotate(45deg);"><path fill="black" d="M16 20H8V6h2V4h4v2h2v14z"/></svg>`;
        } else if (closest.type === 'sofa') {
          promptUI.innerHTML = `<svg viewBox="0 0 24 24"><path fill="black" d="M4 10V7c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2v3c1.1 0 2 .9 2 2v5h-2v2h-2v-2H6v2H4v-2H2v-5c0-1.1.9-2 2-2z"/></svg>`;
        } else {
          promptUI.innerHTML = `<svg viewBox="0 0 24 24"><path fill="black" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>`;
        }
      } else {
        currentPromptTarget = null;
        promptUI.style.display = 'none';
      }
    }

    document.getElementById('interactionPrompt').addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentPromptTarget) currentPromptTarget.action();
    });

    // MENUS
    document.getElementById('playBtn').addEventListener('click', () => {
      document.getElementById('mainMenu').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      ensureAudioContext();
      initGame();
    });

    document.getElementById('avatarBtn').addEventListener('click', () => {
      document.getElementById('mainMenu').classList.add('hidden');
      document.getElementById('avatarMenu').classList.remove('hidden');
    });

    document.getElementById('saveAvatarBtn').addEventListener('click', () => {
      playerState.colors.head = document.getElementById('colHead').value;
      playerState.colors.torso = document.getElementById('colTorso').value;
      playerState.colors.lArm = document.getElementById('colLArm').value;
      playerState.colors.rArm = document.getElementById('colRArm').value;
      playerState.colors.lLeg = document.getElementById('colLLeg').value;
      playerState.colors.rLeg = document.getElementById('colRLeg').value;

      if (avatarMaterials.head) applyAvatarColors();

      document.getElementById('avatarMenu').classList.add('hidden');
      document.getElementById('mainMenu').classList.remove('hidden');
    });

    window.addEventListener('resize', () => engine.resize());
  </script>
</body>
</html>
